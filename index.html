let backend = { type: 'local' };
(function initBackend() {
  const configured = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('YOUR_');
  if (configured && window.firebase) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      backend = { type: 'firebase', db: firebase.firestore() };
      console.info('[BloodConnect] Firestore backend active.');
      return;
    } catch (e) { console.warn('[BloodConnect] Firebase init failed, using local storage.', e); }
  }
  console.info('[BloodConnect] Local storage backend active (no Firebase config).');
})();

const LS_KEYS = { requests: 'bc_requests_v1', donors: 'bc_donors_v1', seq: 'bc_seq_v1', visits: 'bc_visits_v1' };

function lsRead(col) {
  try { return JSON.parse(localStorage.getItem(LS_KEYS[col]) || '[]'); } catch (e) { return []; }
}
function lsWrite(col, arr) {
  try { localStorage.setItem(LS_KEYS[col], JSON.stringify(arr)); } catch (e) {}
}

async function fetchAll(col) {
  if (backend.type === 'firebase') {
    try {
      const snap = await backend.db.collection(col).orderBy('createdAt', 'desc').limit(400).get();
      return snap.docs.map(d => d.data());
    } catch (e) { console.warn(e); return []; }
  }
  return lsRead(col);
}

async function getDoc(col, id) {
  if (backend.type === 'firebase') {
    try {
      const d = await backend.db.collection(col).doc(id).get();
      return d.exists ? d.data() : null;
    } catch (e) { console.warn(e); return null; }
  }
  return lsRead(col).find(x => x.id === id) || null;
}

async function putDoc(col, id, data, merge) {
  if (backend.type === 'firebase') {
    await backend.db.collection(col).doc(id).set(data, { merge: !!merge });
    return;
  }
  const arr = lsRead(col);
  const i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = merge ? { ...arr[i], ...data } : data;
  else arr.unshift(data);
  lsWrite(col, arr);
}

async function nextRequestSeq() {
  if (backend.type === 'firebase') {
    const ref = backend.db.collection('meta').doc('counters');
    return backend.db.runTransaction(async (tx) => {
      const doc = await tx.get(ref);
      let n = doc.exists ? (doc.data().requestSeq || 0) : 0;
      n += 1;
      tx.set(ref, { requestSeq: n }, { merge: true });
      return n;
    });
  }
  const n = parseInt(localStorage.getItem(LS_KEYS.seq) || '0', 10) + 1;
  try { localStorage.setItem(LS_KEYS.seq, String(n)); } catch (e) {}
  return n;
}

async function nextRequestId() {
  const year = new Date().getFullYear();
  const n = await nextRequestSeq();
  return `BC-${year}-${String(n).padStart(3, '0')}`;
}

function nextDonorId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return 'BC-D-' + s;
}

async function incrementVisitsAndGet() {
  const hasVisited = sessionStorage.getItem('bc_session_visit');
  if (!hasVisited) {
    sessionStorage.setItem('bc_session_visit', 'true');
    if (backend.type === 'firebase') {
      try {
        const ref = backend.db.collection('meta').doc('stats');
        await ref.set({ visits: firebase.firestore.FieldValue.increment(1) }, { merge: true });
      } catch(e) { console.warn('Visit increment failed', e); }
    } else {
      let v = parseInt(localStorage.getItem(LS_KEYS.visits) || '0', 10);
      localStorage.setItem(LS_KEYS.visits, String(v + 1));
    }
  }
  if (backend.type === 'firebase') {
    try {
      const doc = await backend.db.collection('meta').doc('stats').get();
      return doc.exists ? (doc.data().visits || 1) : 1;
    } catch(e) { return 1; }
  }
  return parseInt(localStorage.getItem(LS_KEYS.visits) || '1', 10);
}

const BN_DIGITS = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
const bnNum = (s) => String(s).replace(/[0-9]/g, d => BN_DIGITS[d]);
const num = (v, lang) => (lang === 'bn' ? bnNum(v) : String(v));

const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

function fmtDate(d, lang) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt.getTime())) return d;
  if (lang === 'bn') return `${bnNum(dt.getDate())} ${BN_MONTHS[dt.getMonth()]} ${bnNum(dt.getFullYear())}`;
  return `${dt.getDate()} ${EN_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
}

function fmtTime(v, lang) {
  if (!v) return '—';
  const parts = String(v).split(':');
  let h = parseInt(parts[0], 10);
  const m = parts[1] || '00';
  if (isNaN(h)) return v;
  const ap = h >= 12 ? 'PM' : 'AM';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${num(hh, lang)}:${num(m, lang)} ${ap}`;
}

function reqStatus(r) {
  if (r.fulfilled) return 'fulfilled';
  if (r.requiredDate) {
    const d = new Date(r.requiredDate + 'T23:59:59');
    if (!isNaN(d.getTime()) && d.getTime() < Date.now()) return 'expired';
  }
  return 'active';
}

const BASE_PATH = (function () {
  const p = window.location.pathname;
  if (p.endsWith('.html')) return p.replace(/[^/]*$/, '');
  return '/';
})();

function publicUrl(path) {
  const base = BASE_PATH.replace(/\/$/, '');
  return window.location.origin + base + path;
}

function getPath() {
  let p = window.location.hash.startsWith('#/') ? window.location.hash.slice(1) : window.location.pathname;
  if (p.endsWith('.html')) p = '/';
  if (!p.startsWith('/')) p = '/' + p;
  p = p.replace(/\/+$/, '');
  return p || '/';
}

function navigate(to) {
  try { window.history.pushState({}, '', to); }
  catch (e) { window.location.hash = to; }
  window.dispatchEvent(new Event('popstate'));
  window.scrollTo(0, 0);
}

function isValidPhone(v) {
  const digits = String(v || '').replace(/[^0-9]/g, '');
  return digits.length >= 10 && digits.length <= 15;
}

function Typewriter({ text, speed = 70, startDelay = 600 }) {
  const [displayedText, setDisplayedText] = useState('');
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isDone, setIsDone] = useState(false);
  const [hasStarted, setHasStarted] = useState(false);

  useEffect(() => {
    setDisplayedText('');
    setCurrentIndex(0);
    setIsDone(false);
    setHasStarted(false);
    const delayTimer = setTimeout(() => setHasStarted(true), startDelay);
    return () => clearTimeout(delayTimer);
  }, [text, startDelay]);

  useEffect(() => {
    if (!hasStarted) return;
    if (currentIndex < text.length) {
      const timeout = setTimeout(() => {
        setDisplayedText(prev => prev + text[currentIndex]);
        setCurrentIndex(prev => prev + 1);
      }, speed);
      return () => clearTimeout(timeout);
    } else {
      setIsDone(true);
    }
  }, [currentIndex, text, speed, hasStarted]);

  return (
    <span>
      {displayedText}
      <span className={`inline-block w-[3px] h-[0.9em] ml-1 align-middle bg-white ${isDone ? 'opacity-0' : 'cursor-blink'}`} />
    </span>
  );
}

function MyRequestsPage({ lang, t, showToast }) {
  const [myReqs, setMyReqs] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    const savedIds = JSON.parse(localStorage.getItem('my_req_ids') || '[]');
    if (savedIds.length === 0) { setLoaded(true); return; }
    fetchAll('requests').then(allReqs => {
      setMyReqs(allReqs.filter(r => savedIds.includes(r.id)));
      setLoaded(true);
    });
  }, []);

  const handleDelete = async (id, e) => {
    e.stopPropagation(); // Prevents opening the profile card
    if (!window.confirm(t('confirm_delete'))) return;
    try {
      if (backend.type === 'firebase') {
        await backend.db.collection('requests').doc(id).delete();
      } else {
        lsWrite('requests', lsRead('requests').filter(x => x.id !== id));
      }
      const savedIds = JSON.parse(localStorage.getItem('my_req_ids') || '[]').filter(x => x !== id);
      localStorage.setItem('my_req_ids', JSON.stringify(savedIds));
      setMyReqs(myReqs.filter(r => r.id !== id));
      showToast(t('deleted_success'));
    } catch(err) { showToast(t('err_generic')); }
  };

  return (
    <div className="mx-auto max-w-4xl px-4 py-10 min-h-[60vh]">
      <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white mb-6">{t('my_reqs_title')}</h1>
      {!loaded ? <CenteredLoader t={t} /> : myReqs.length === 0 ? (
        <Card><div className="text-center py-8 text-slate-500 dark:text-slate-400">{t('my_reqs_empty')}</div></Card>
      ) : (
        <div className="grid gap-4 sm:grid-cols-2">
          {myReqs.map(r => (
            <div key={r.id} className="relative group">
              <RequestListCard req={r} lang={lang} t={t} />
              <button 
                onClick={(e) => handleDelete(r.id, e)}
                className="absolute top-3 right-10 grid h-8 w-8 place-items-center rounded-lg bg-red-100 text-red-600 shadow-sm hover:bg-red-200 transition z-10"
                title={t('delete_req')}
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="h-4 w-4"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AdminPage({ lang, t }) {
  const [pass, setPass] = useState('');
  const [auth, setAuth] = useState(false);
  const [reqs, setReqs] = useState([]);
  const [dons, setDons] = useState([]);

  useEffect(() => {
    if (auth) {
      fetchAll('requests').then(setReqs);
      fetchAll('donors').then(setDons);
    }
  }, [auth]);
  
  

  const deleteReq = async (id) => {
    if (!window.confirm("Are you sure you want to delete this request?")) return;
    if (backend.type === 'firebase') await backend.db.collection('requests').doc(id).delete();
    else lsWrite('requests', lsRead('requests').filter(x => x.id !== id));
    setReqs(reqs.filter(r => r.id !== id));
  };
  
    const verifyReq = async (id) => {
    try {
      await putDoc('requests', id, { verified: true }, true);
      setReqs(reqs.map(r => r.id === id ? { ...r, verified: true } : r));
    } catch (e) { alert('Failed to verify'); }
  };

  const deleteDon = async (id) => {
    if (!window.confirm("Are you sure you want to delete this donor?")) return;
    if (backend.type === 'firebase') await backend.db.collection('donors').doc(id).delete();
    else lsWrite('donors', lsRead('donors').filter(x => x.id !== id));
    setDons(dons.filter(d => d.id !== id));

  if (!auth) {
    return (

          {t('admin_login')}
        </button>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-5xl px-4 py-8">
      <div className="flex justify-between items-center mb-6">
        <h1 className="text-2xl font-extrabold text-slate-900">{t('admin_title')}</h1>
        <button onClick={() => setAuth(false)} className="text-brand-600 font-bold text-sm bg-brand-50 px-3 py-1.5 rounded-lg">{t('admin_logout')}</button>

/* ══════════════════════════════════════════════════════════════
   12. BLOOD REQUEST FORM (Updated to save to localStorage)
   ══════════════════════════════════════════════════════════════ */
const EMPTY_REQUEST = {
  patientName: '', patientAge: '', bloodGroup: '', bags: '1', hospitalName: '', hospitalAddress: '', requiredDate: '', requiredTime: '',
  urgency: 'normal', division: '', district: '', upazila: '', area: '', detailedAddress: '', contactName: '', phone: '', altPhone: '', whatsapp: '+880', notes: ''
};

function RequestFormPage({ lang, t, showToast }) {
  const [form, setForm] = useState(EMPTY_REQUEST);
  const [confirmed, setConfirmed] = useState(false);
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const topRef = useRef(null);

  const set = (k) => (e) => {
    const v = e && e.target ? e.target.value : e;
    setForm((f) => {
      const next = { ...f, [k]: v };
      if (k === 'division') { next.district = ''; }
      return next;
    });
    setErrors((er) => ({ ...er, [k]: null }));
  };

  const districts = useMemo(() => {
    const d = DIVISIONS.find((x) => x.en === form.division);
    return d ? d.districts : [];
  }, [form.division]);

  function validate() {
    const e = {};
    ['patientName', 'patientAge', 'bloodGroup', 'bags', 'hospitalName', 'hospitalAddress', 'requiredDate', 'requiredTime', 'division', 'district', 'upazila', 'area', 'detailedAddress', 'contactName', 'phone'].forEach((k) => {
      if (!String(form[k] || '').trim()) e[k] = t('err_required');
    });
    if (form.phone && !isValidPhone(form.phone)) e.phone = t('err_phone');
    if (form.altPhone && !isValidPhone(form.altPhone)) e.altPhone = t('err_phone');
    if (form.whatsapp && !isValidPhone(form.whatsapp)) e.whatsapp = t('err_phone');
    if (!confirmed) e.confirm = t('err_confirm');
    return e;
  }

  async function submit(ev) {
    ev.preventDefault();
    const e = validate();
    if (Object.keys(e).length) {
      setErrors(e);
      if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    setBusy(true);
    try {
      const id = await nextRequestId();
      const record = {
        ...form, patientAge: Number(form.patientAge) || form.patientAge, bags: Number(form.bags) || 1,
        id, fulfilled: false, createdAt: new Date().toISOString()
      };
      await putDoc('requests', id, record);
      
      // NEW: Save to My Requests in LocalStorage
      const myIds = JSON.parse(localStorage.getItem('my_req_ids') || '[]');
      if (!myIds.includes(id)) myIds.push(id);
      localStorage.setItem('my_req_ids', JSON.stringify(myIds));

      showToast(t('msg_request_created'));
      navigate('/request/' + id);
    } catch (err) {
      console.error(err);
      showToast(t('err_generic'));
    }
    setBusy(false);
  }

  return (
    <div className="mx-auto max-w-3xl px-4 py-8" ref={topRef}>
      <button onClick={() => navigate('/')} className="mb-5 inline-flex items-center gap-1.5 text-[13px] font-bold text-slate-500 hover:text-brand-600">
        <Icon.arrowLeft width="15" height="15" /> {t('back')}
      </button>

      <div className="rounded-3xl bg-gradient-to-br from-brand-600 to-brand-900 p-6 text-white shadow-red">
        <span className="inline-flex items-center gap-2 rounded-full bg-white/15 px-3 py-1 text-[11px] font-bold"><Icon.drop width="12" height="12" /> {t('request_profile')}</span>
        <h1 className="mt-3 text-[24px] font-extrabold leading-tight sm:text-3xl">{t('rf_title')}</h1>
        <p className="mt-2 text-[13px] leading-relaxed text-white/80">{t('rf_sub')}</p>
      </div>

      <form onSubmit={submit} className="mt-5 space-y-4">
        <Card>
          <SectionTitle>{t('patient_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label={t('patient_name')} required error={errors.patientName}>
                <input className={inputCls} value={form.patientName} onChange={set('patientName')} placeholder="Md. Rahim Uddin" />
              </Field>
            </div>
            <Field label={t('patient_age')} required error={errors.patientAge}>
              <input type="number" min="0" max="120" className={inputCls} value={form.patientAge} onChange={set('patientAge')} placeholder="34" />
            </Field>
            <Field label={t('blood_group')} required error={errors.bloodGroup}>
              <select className={selectCls} style={selectStyle} value={form.bloodGroup} onChange={set('bloodGroup')}>
                <option value="">{t('any')}</option>{BLOOD_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
              </select>
            </Field>
            <Field label={t('bags')} required error={errors.bags}>
              <input type="number" min="1" max="50" className={inputCls} value={form.bags} onChange={set('bags')} />
            </Field>
            <Field label={t('urgency')} required error={errors.urgency}>
              <select className={selectCls} style={selectStyle} value={form.urgency} onChange={set('urgency')}>
                <option value="normal">{t('urgency_normal')}</option><option value="urgent">{t('urgency_urgent')}</option><option value="critical">{t('urgency_critical')}</option>
              </select>
            </Field>
          </div>
        </Card>

        <Card>
          <SectionTitle>{t('hospital_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label={t('hospital_name')} required error={errors.hospitalName}>
                <input className={inputCls} value={form.hospitalName} onChange={set('hospitalName')} placeholder="Dhaka Medical College Hospital" />
              </Field>
            </div>
            <div className="sm:col-span-2">
              <Field label={t('hospital_address')} required error={errors.hospitalAddress}>
                <input className={inputCls} value={form.hospitalAddress} onChange={set('hospitalAddress')} placeholder="Bakshi Bazar, Dhaka 1000" />
              </Field>
            </div>
            <Field label={t('required_date')} required error={errors.requiredDate}>

};

function DonorFormPage({ lang, t, showToast }) {
  const [form, setForm] = useState(EMPTY_DONOR);
  const [confirmed, setConfirmed] = useState(false);
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const topRef = useRef(null);

  const set = (k) => (e) => {
    const v = e && e.target ? e.target.value : e;
    setForm((f) => {
      const next = { ...f, [k]: v };
      if (k === 'division') next.district = '';
      return next;
    });
    setErrors((er) => ({ ...er, [k]: null }));
  };

  const districts = useMemo(() => {
    const d = DIVISIONS.find((x) => x.en === form.division);
    return d ? d.districts : [];
  }, [form.division]);

  function validate() {
    const e = {};
    ['fullName', 'bloodGroup', 'phone', 'division', 'district', 'upazila', 'area'].forEach((k) => {
      if (!String(form[k] || '').trim()) e[k] = t('err_required');
    });
    if (form.phone && !isValidPhone(form.phone)) e.phone = t('err_phone');
    if (form.whatsapp && !isValidPhone(form.whatsapp)) e.whatsapp = t('err_phone');
    if (!confirmed) e.confirm = t('err_confirm');
    return e;
  }

  async function submit(ev) {
    ev.preventDefault();
    const e = validate();
    if (Object.keys(e).length) {
      setErrors(e);
      if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    setBusy(true);
    try {
      let id = nextDonorId();
      let guard = 0;
      while (guard < 5) {
        const existing = await getDoc('donors', id);
        if (!existing) break;
        id = nextDonorId();
        guard++;
      }
      const record = { ...form, id, createdAt: new Date().toISOString() };
      await putDoc('donors', id, record);
      showToast(t('msg_donor_created'));
      navigate('/donor/' + id);
    } catch (err) {
      console.error(err);
      showToast(t('err_generic'));
    }
    setBusy(false);
  }

  return (
    <div className="mx-auto max-w-3xl px-4 py-8" ref={topRef}>
      <button onClick={() => navigate('/')} className="mb-5 inline-flex items-center gap-1.5 text-[13px] font-bold text-slate-500 hover:text-brand-600">

      <form onSubmit={submit} className="mt-5 space-y-4">
        <Card>
          <SectionTitle>{t('patient_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label={t('full_name')} required error={errors.fullName}>
                <input className={inputCls} value={form.fullName} onChange={set('fullName')} placeholder="Abdullah Al Mamun" />
              </Field>
            </div>
            <Field label={t('blood_group')} required error={errors.bloodGroup}>
              <select className={selectCls} style={selectStyle} value={form.bloodGroup} onChange={set('bloodGroup')}>

function ShareBar({ url, message, t, onDownload, busy }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(url); } catch (e) {
      const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (err) {} document.body.removeChild(ta);
    }
    setCopied(true); setTimeout(() => setCopied(false), 2200);
  };
  const wa = `https://wa.me/?text=${encodeURIComponent(message + '\n' + url)}`;
  const fb = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
  const native = async () => {
    if (navigator.share) { try { await navigator.share({ title: t('app'), text: message, url }); } catch (e) {} } else { copy(); }
  };
  const btn = 'flex flex-col items-center justify-center gap-1.5 rounded-2xl border px-2 py-3 text-[11px] font-bold transition active:scale-[.97]';

  return (
    <div>
      <h3 className="mb-3 text-[13px] font-extrabold text-slate-700">{t('share_this')}</h3>
      <div className="grid grid-cols-4 gap-2">
        <a href={wa} target="_blank" rel="noopener noreferrer" className={`${btn} border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100`}><Icon.whatsapp width="19" height="19" /> {t('chat_whatsapp')}</a>
        <a href={fb} target="_blank" rel="noopener noreferrer" className={`${btn} border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100`}><Icon.facebook width="19" height="19" /> Facebook</a>
        <button onClick={copy} className={`${btn} ${copied ? 'border-brand-300 bg-brand-100 text-brand-800' : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'}`}>{copied ? <Icon.check width="19" height="19" /> : <Icon.copy width="19" height="19" />}{copied ? t('copied') : t('copy_link')}</button>
        <button onClick={native} className={`${btn} border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100`}><Icon.share width="19" height="19" /> {t('native_share')}</button>
      </div>
      {onDownload && (
        <button onClick={onDownload} disabled={busy} className="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-500 to-brand-700 px-6 py-4 text-[14.5px] font-extrabold text-white shadow-red transition enabled:hover:brightness-105 enabled:active:scale-[.99] disabled:opacity-50">
          {busy ? <><Spinner /> {t('generating')}</> : <><Icon.download width="18" height="18" /> {t('download_card')}</>}
        </button>
      )}
      <div className="mt-3 rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5">
        <div className="text-[10.5px] font-bold uppercase tracking-wide text-slate-400">{t('public_link')}</div>
        <div className="mt-0.5 truncate text-[12px] font-semibold text-slate-600">{url}</div>
      </div>
    </div>
  );
}

      )}
            {/* Alert Banner for Reports */}
      {req.reports > 0 && (
        <div className="mt-4 rounded-xl border border-red-200 bg-red-50 p-4 text-[13px] font-semibold text-red-700 flex items-center gap-2">
          <Icon.flag width="18" height="18" /> {t('report_alert')} ({req.reports})

      )}

      {/* Report Button */}
      <button onClick={handleReport} className="mt-4 flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-6 py-3.5 text-[13.5px] font-extrabold text-slate-500 dark:text-slate-400 transition hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-[.99]">
        <Icon.flag width="17" height="17" /> {t('report_btn')}
      </button>

  );
}

function FilterShell({ title, sub, children }) {
  return (
    <div className="rounded-3xl bg-gradient-to-br from-brand-600 to-brand-900 p-5 text-white shadow-red">
      <h1 className="text-[22px] font-extrabold leading-tight sm:text-3xl">{title}</h1>
      <p className="mt-1.5 text-[12.5px] leading-relaxed text-white/75">{sub}</p>
      <div className="mt-4">{children}</div>
    </div>
  );
}

const filterSelect = 'w-full rounded-xl border border-white/20 bg-white/10 px-3 py-2.5 text-[12.5px] font-semibold text-white outline-none backdrop-blur transition focus:border-white/50 [&>option]:text-slate-900';

function DonorSearchPage({ lang, t }) {
  const [f, setF] = useState({ bloodGroup: '', division: '', district: '', upazila: '', availability: '' });
  const [list, setList] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => { fetchAll('donors').then((d) => { setList(d); setLoaded(true); }); }, []);
  const districts = useMemo(() => { const d = DIVISIONS.find((x) => x.en === f.division); return d ? d.districts : []; }, [f.division]);

  const set = (k) => (e) => {
    const v = e.target.value;
    setF((prev) => { const next = { ...prev, [k]: v }; if (k === 'division') next.district = ''; return next; });
  };

  const results = useMemo(() => {
    return list.filter((d) => {
      if (f.bloodGroup && d.bloodGroup !== f.bloodGroup) return false;
      if (f.division && d.division !== f.division) return false;
      if (f.district && d.district !== f.district) return false;
      if (f.upazila && !String(d.upazila || '').toLowerCase().includes(f.upazila.toLowerCase())) return false;
      if (f.availability && d.availability !== f.availability) return false;
      return true;
    });
  }, [list, f]);

  const reset = () => setF({ bloodGroup: '', division: '', district: '', upazila: '', availability: '' });

  return (
    <div className="mx-auto max-w-5xl px-4 py-6">
      <FilterShell title={t('ds_title')} sub={t('ds_sub')}>
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-5">
          <select className={filterSelect} value={f.bloodGroup} onChange={set('bloodGroup')}><option value="">{t('blood_group')}: {t('any')}</option>{BLOOD_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}</select>
          <select className={filterSelect} value={f.division} onChange={set('division')}><option value="">{t('division')}: {t('any')}</option>{DIVISIONS.map((d) => <option key={d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}</select>
          <select className={filterSelect} value={f.district} onChange={set('district')} disabled={!f.division}><option value="">{t('district')}: {t('any')}</option>{districts.map((d) => <option key={d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}</select>
          <input className={filterSelect + ' placeholder-white/60'} value={f.upazila} onChange={set('upazila')} placeholder={t('upazila')} />
          <select className={filterSelect} value={f.availability} onChange={set('availability')}><option value="">{t('filter_availability')}: {t('any')}</option><option value="available">{t('available')}</option><option value="unavailable">{t('unavailable')}</option></select>
        </div>
        <button onClick={reset} className="mt-2.5 rounded-lg border border-white/25 bg-white/10 px-3 py-1.5 text-[11.5px] font-bold text-white/90 hover:bg-white/20">{t('reset')}</button>
      </FilterShell>
      <div className="mt-4 flex items-center justify-between"><p className="text-[12.5px] font-semibold text-slate-500">{loaded ? `${num(results.length, lang)} ${t('found')}` : t('loading')}</p></div>
      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        {!loaded ? <Card className="sm:col-span-2"><div className="py-6 text-center text-[13px] text-slate-400">{t('loading')}</div></Card> : results.length === 0 ? <Card className="sm:col-span-2"><div className="py-8 text-center text-[13px] text-slate-400">{t('no_donors')}</div></Card> : results.map((d) => <DonorListCard key={d.id} donor={d} lang={lang} t={t} />)}
      </div>
    </div>
  );
}

function RequestSearchPage({ lang, t }) {
  const [f, setF] = useState({ bloodGroup: '', district: '', upazila: '', urgency: '', status: '' });
  const [list, setList] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => { fetchAll('requests').then((d) => { setList(d); setLoaded(true); }); }, []);
  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

  const results = useMemo(() => {
    return list.filter((r) => {
      if (f.bloodGroup && r.bloodGroup !== f.bloodGroup) return false;
      if (f.district && r.district !== f.district) return false;
      if (f.upazila && !String(r.upazila || '').toLowerCase().includes(f.upazila.toLowerCase())) return false;
      if (f.urgency && r.urgency !== f.urgency) return false;
      if (f.status && reqStatus(r) !== f.status) return false;
      return true;
    });
  }, [list, f]);

  const allDistricts = useMemo(() => DIVISIONS.flatMap((d) => d.districts.map((x) => ({ ...x, div: d.en }))), []);
  const reset = () => setF({ bloodGroup: '', district: '', upazila: '', urgency: '', status: '' });

  return (
    <div className="mx-auto max-w-5xl px-4 py-6">
      <FilterShell title={t('rs_title')} sub={t('rs_sub')}>
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-5">
          <select className={filterSelect} value={f.bloodGroup} onChange={set('bloodGroup')}><option value="">{t('blood_group')}: {t('any')}</option>{BLOOD_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}</select>
          <select className={filterSelect} value={f.district} onChange={set('district')}><option value="">{t('district')}: {t('any')}</option>{allDistricts.map((d) => <option key={d.div + d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}</select>
          <input className={filterSelect + ' placeholder-white/60'} value={f.upazila} onChange={set('upazila')} placeholder={t('upazila')} />
          <select className={filterSelect} value={f.urgency} onChange={set('urgency')}><option value="">{t('urgency')}: {t('any')}</option><option value="normal">{t('urgency_normal')}</option><option value="urgent">{t('urgency_urgent')}</option><option value="critical">{t('urgency_critical')}</option></select>
          <select className={filterSelect} value={f.status} onChange={set('status')}><option value="">{t('status')}: {t('any')}</option><option value="active">{t('status_active')}</option><option value="fulfilled">{t('status_fulfilled')}</option><option value="expired">{t('status_expired')}</option></select>
        </div>
        <button onClick={reset} className="mt-2.5 rounded-lg border border-white/25 bg-white/10 px-3 py-1.5 text-[11.5px] font-bold text-white/90 hover:bg-white/20">{t('reset')}</button>
      </FilterShell>
      <div className="mt-4 flex items-center justify-between">
        <p className="text-[12.5px] font-semibold text-slate-500">{loaded ? `${num(results.length, lang)} ${t('found')}` : t('loading')}</p>
        <button onClick={() => navigate('/request-blood')} className="inline-flex items-center gap-1 rounded-lg bg-brand-50 px-3 py-1.5 text-[11.5px] font-bold text-brand-700"><Icon.plus width="13" height="13" /> {t('nav_request')}</button>
      </div>
      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        {!loaded ? <Card className="sm:col-span-2"><div className="py-6 text-center text-[13px] text-slate-400">{t('loading')}</div></Card> : results.length === 0 ? <Card className="sm:col-span-2"><div className="py-8 text-center text-[13px] text-slate-400">{t('no_requests')}</div></Card> : results.map((r) => <RequestListCard key={r.id} req={r} lang={lang} t={t} />)}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   15. APP ROOT & ROUTER
   ══════════════════════════════════════════════════════════════ */
function App() {
  const [lang, setLangState] = useState(() => localStorage.getItem('bc_lang') || 'en');
    const [theme, setThemeState] = useState(() => localStorage.getItem('bc_theme') || 'light');
  const [path, setPath] = useState(getPath());
  const [toast, setToast] = useState('');
    const setTheme = (th) => { 
    setThemeState(th); 
    try { localStorage.setItem('bc_theme', th); } catch (e) {} 
  };

  useEffect(() => {
    if (theme === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [theme]);

  const t = useCallback((key) => (T[lang] && T[lang][key] !== undefined ? T[lang][key] : key), [lang]);

  const setLang = (l) => { setLangState(l); try { localStorage.setItem('bc_lang', l); } catch (e) {} };

  useEffect(() => {
    document.documentElement.lang = lang;
    document.title = T[lang].app + ' — ' + T[lang].tag;
  }, [lang]);

  useEffect(() => {
    const onPop = () => setPath(getPath());
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2600); };

  const segments = path.split('/').filter(Boolean);
  let page;
  if (segments.length === 0) page = { name: 'home' };
  else if (segments[0] === 'request-blood') page = { name: 'requestForm' };
  else if (segments[0] === 'register-donor') page = { name: 'donorForm' };
  else if (segments[0] === 'donors') page = { name: 'donorSearch' };
  else if (segments[0] === 'requests') page = { name: 'requestSearch' };
  else if (segments[0] === 'articles') page = { name: 'articles' };
  else if (segments[0] === 'faq') page = { name: 'faq' };
  else if (segments[0] === 'my-requests') page = { name: 'myRequests' };
  else if (segments[0] === 'admin') page = { name: 'admin' };
  else if (segments[0] === 'article' && segments[1]) page = { name: 'articleDetail', id: segments[1] };
  else if (segments[0] === 'request' && segments[1]) page = { name: 'requestProfile', id: segments[1] };
  else if (segments[0] === 'donor' && segments[1]) page = { name: 'donorProfile', id: segments[1] };
  else page = { name: 'home' };

  let content;
  switch (page.name) {
    case 'requestForm': content = <RequestFormPage lang={lang} t={t} showToast={showToast} />; break;
    case 'donorForm': content = <DonorFormPage lang={lang} t={t} showToast={showToast} />; break;
    case 'donorSearch': content = <DonorSearchPage lang={lang} t={t} />; break;
    case 'requestSearch': content = <RequestSearchPage lang={lang} t={t} />; break;
    case 'articles': content = <ArticlesPage lang={lang} t={t} />; break;
    case 'articleDetail': content = <ArticleDetailPage id={page.id} lang={lang} t={t} />; break;
    case 'faq': content = <FaqPage lang={lang} t={t} />; break;
    case 'myRequests': content = <MyRequestsPage lang={lang} t={t} showToast={showToast} />; break;
    case 'admin': content = <AdminPage lang={lang} t={t} />; break;
    case 'requestProfile': content = <RequestProfilePage id={page.id} lang={lang} t={t} showToast={showToast} />; break;
    case 'donorProfile': content = <DonorProfilePage id={page.id} lang={lang} t={t} />; break;
    default: content = <HomePage lang={lang} t={t} />;
  }

  return (
<div className="min-h-screen bg-slate-50/50 dark:bg-slate-950 flex flex-col justify-between">


      <div>
        <Header lang={lang} setLang={setLang} t={t} theme={theme} setTheme={setTheme} />
        <main key={path + lang}>{content}</main>
      </div>
      <Footer t={t} />
      <Toast message={toast} />
      
      <div className="pointer-events-none fixed inset-x-0 bottom-0 z-30 flex justify-center pb-4 md:hidden">
        <button onClick={() => navigate('/request-blood')} className="pointer-events-auto inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-brand-500 to-brand-700 px-5 py-3.5 text-[13px] font-extrabold text-white shadow-red active:scale-95">
          <Icon.drop width="16" height="16" /> {t('nav_request')}
        </button>
      </div>
      <div className="h-16 md:hidden" />
    </div>
  );
}

const rootEl = document.getElementById('root');
rootEl.innerHTML = '';
ReactDOM.createRoot(rootEl).render(<App />);
</script>
