const FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",

/* ══════════════════════════════════════════════════════════════
   2. BACKEND LAYER (Firestore  ⟷  localStorage fallback)
   ══════════════════════════════════════════════════════════════ */
let backend = { type: 'local' };
(function initBackend() {
  const configured = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('YOUR_');
  if (configured && window.firebase) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      backend = { type: 'firebase', db: firebase.firestore() };
      console.info('[BloodConnect] Firestore backend active.');
      return;
    } catch (e) { console.warn('[BloodConnect] Firebase init failed, using local storage.', e); }
  }
  console.info('[BloodConnect] Local storage backend active (no Firebase config).');
})();

const LS_KEYS = { requests: 'bc_requests_v1', donors: 'bc_donors_v1', seq: 'bc_seq_v1' };

function lsRead(col) {
  try { return JSON.parse(localStorage.getItem(LS_KEYS[col]) || '[]'); } catch (e) { return []; }
}
function lsWrite(col, arr) {
  try { localStorage.setItem(LS_KEYS[col], JSON.stringify(arr)); } catch (e) {}
}

async function fetchAll(col) {
  if (backend.type === 'firebase') {
    try {
      const snap = await backend.db.collection(col).orderBy('createdAt', 'desc').limit(400).get();
      return snap.docs.map(d => d.data());
    } catch (e) { console.warn(e); return []; }
  }
  return lsRead(col);
}

async function getDoc(col, id) {
  if (backend.type === 'firebase') {
    try {
      const d = await backend.db.collection(col).doc(id).get();
      return d.exists ? d.data() : null;
    } catch (e) { console.warn(e); return null; }
  }
  return lsRead(col).find(x => x.id === id) || null;
}

async function putDoc(col, id, data, merge) {
  if (backend.type === 'firebase') {
    await backend.db.collection(col).doc(id).set(data, { merge: !!merge });
    return;
  }
  const arr = lsRead(col);
  const i = arr.findIndex(x => x.id === id);
  if (i >= 0) arr[i] = merge ? { ...arr[i], ...data } : data;
  else arr.unshift(data);
  lsWrite(col, arr);
}

async function nextRequestSeq() {
  if (backend.type === 'firebase') {
    const ref = backend.db.collection('meta').doc('counters');
    return backend.db.runTransaction(async (tx) => {
      const doc = await tx.get(ref);
      let n = doc.exists ? (doc.data().requestSeq || 0) : 0;
      n += 1;
      tx.set(ref, { requestSeq: n }, { merge: true });
      return n;
    });
  }
  const n = parseInt(localStorage.getItem(LS_KEYS.seq) || '0', 10) + 1;
  try { localStorage.setItem(LS_KEYS.seq, String(n)); } catch (e) {}
  return n;
}

async function nextRequestId() {
  const year = new Date().getFullYear();
  const n = await nextRequestSeq();
  return `BC-${year}-${String(n).padStart(3, '0')}`;
}

function nextDonorId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return 'BC-D-' + s;
}

/* ══════════════════════════════════════════════════════════════
   5. HELPERS
   ══════════════════════════════════════════════════════════════ */
const BN_DIGITS = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
const bnNum = (s) => String(s).replace(/[0-9]/g, d => BN_DIGITS[d]);
const num = (v, lang) => (lang === 'bn' ? bnNum(v) : String(v));

const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

function fmtDate(d, lang) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt.getTime())) return d;
  if (lang === 'bn') return `${bnNum(dt.getDate())} ${BN_MONTHS[dt.getMonth()]} ${bnNum(dt.getFullYear())}`;
  return `${dt.getDate()} ${EN_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
}

function fmtTime(v, lang) {
  if (!v) return '—';
  const parts = String(v).split(':');
  let h = parseInt(parts[0], 10);
  const m = parts[1] || '00';
  if (isNaN(h)) return v;
  const ap = h >= 12 ? 'PM' : 'AM';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${num(hh, lang)}:${num(m, lang)} ${ap}`;
}

function reqStatus(r) {
  if (r.fulfilled) return 'fulfilled';
  if (r.requiredDate) {
    const d = new Date(r.requiredDate + 'T23:59:59');
    if (!isNaN(d.getTime()) && d.getTime() < Date.now()) return 'expired';
  }
  return 'active';
}

const BASE_PATH = (function () {
  const p = window.location.pathname;
  if (p.endsWith('.html')) return p.replace(/[^/]*$/, '');
  return '/';
})();

function publicUrl(path) {
  const base = BASE_PATH.replace(/\/$/, '');
  return window.location.origin + base + path;
}

/* ── Router ─────────────────────────────────────────────────── */
function getPath() {
  let p = window.location.hash.startsWith('#/') ? window.location.hash.slice(1) : window.location.pathname;
  if (p.endsWith('.html')) p = '/';
  if (!p.startsWith('/')) p = '/' + p;
  p = p.replace(/\/+$/, '');
  return p || '/';
}

function navigate(to) {
  try { window.history.pushState({}, '', to); }
  catch (e) { window.location.hash = to; }
  window.dispatchEvent(new Event('popstate'));
  window.scrollTo(0, 0);
}

function isValidPhone(v) {
  const digits = String(v || '').replace(/[^0-9]/g, '');
  return digits.length >= 10 && digits.length <= 15;
}

function Pill({ tone = 'slate', children }) {
  const tones = {
    slate: 'bg-slate-100 text-slate-600',
    red: 'bg-brand-50 text-brand-700 border border-brand-100',
    green: 'bg-emerald-50 text-emerald-700 border border-emerald-100',

    white: 'bg-white/15 text-white border border-white/25'
  };
  return (
    <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-bold ${tones[tone]}`}>
      {children}
    </span>
  );
}

function StatusPill({ status, t }) {
  const map = {
    active: { tone: 'green', label: t('status_active') },
    fulfilled: { tone: 'slate', label: t('status_fulfilled') },
    expired: { tone: 'amber', label: t('status_expired') }
  };
  const m = map[status] || map.active;
  return <Pill tone={m.tone}>{m.label}</Pill>;
}

function UrgencyPill({ urgency, t }) {
  const tone = urgency === 'critical' ? 'red' : urgency === 'urgent' ? 'amber' : 'slate';
  return <Pill tone={tone}>{t('urgency_' + (urgency || 'normal'))}</Pill>;
}

}

          checked ? 'border-brand-300 bg-brand-50' : 'border-slate-200 bg-slate-50 hover:bg-slate-100'

        <input
          type="checkbox"
          checked={checked}

  );

/* ══════════════════════════════════════════════════════════════
   7. CANVAS CARD GENERATOR (1080 × 1350 PNG)
   ══════════════════════════════════════════════════════════════ */
function rr(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function wrapLines(ctx, text, maxWidth) {
  const words = String(text || '').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}

function makeQRCanvas(text, size) {
  return new Promise((resolve, reject) => {
    if (!window.QRCode) return reject(new Error('QR library unavailable'));
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:1px;height:1px;overflow:hidden';
    document.body.appendChild(holder);
    try {
      new window.QRCode(holder, {
        text, width: size, height: size,
        colorDark: '#0F172A', colorLight: '#FFFFFF',
        correctLevel: window.QRCode.CorrectLevel.M
      });
    } catch (e) {
      document.body.removeChild(holder);
      return reject(e);
    }
    setTimeout(() => {
      const canvas = holder.querySelector('canvas');
      const img = holder.querySelector('img');
      if (canvas) { document.body.removeChild(holder); resolve(canvas); }
      else if (img) {
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, size, size);
        img.onload = () => { cx.drawImage(img, 0, 0, size, size); document.body.removeChild(holder); resolve(c); };
        img.onerror = () => { document.body.removeChild(holder); reject(new Error('QR render failed')); };
      } else {
        document.body.removeChild(holder);
        reject(new Error('QR render failed'));
      }
    }, 90);
  });
}

async function generateRequestCard(req, lang, t) {
  const isBn = lang === 'bn';
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // Make sure webfonts are ready before drawing text
  try {
    await Promise.all([
      document.fonts.load('700 46px "Hind Siliguri"'),
      document.fonts.load('600 30px "Hind Siliguri"'),
      document.fonts.load('400 24px "Hind Siliguri"'),
      document.fonts.load('800 46px "Plus Jakarta Sans"'),
      document.fonts.load('700 30px "Plus Jakarta Sans"'),
      document.fonts.load('500 24px "Plus Jakarta Sans"')
    ]);
    await document.fonts.ready;
  } catch (e) { /* ignore */ }

  const FONT = '"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif';
  const setF = (weight, size) => { ctx.font = `${weight} ${size}px ${FONT}`; };
  const N = (v) => (isBn ? bnNum(v) : String(v));
  const safe = (v) => (v && String(v).trim() ? String(v).trim() : '—');

  /* background */
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#FFF1F2');
  bg.addColorStop(0.5, '#FFFFFF');
  bg.addColorStop(1, '#FFF5F5');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* decorative blobs */
  ctx.fillStyle = 'rgba(245,22,47,0.055)';
  ctx.beginPath(); ctx.arc(1010, 90, 280, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, 1300, 240, 0, Math.PI * 2); ctx.fill();

  /* header band */
  const hg = ctx.createLinearGradient(0, 0, W, 300);
  hg.addColorStop(0, '#F5162F');
  hg.addColorStop(1, '#A10F22');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, 300);

  /* logo droplet */
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.arc(98, 104, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  (function droplet(cx, cy, r) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.bezierCurveTo(cx + r * 0.95, cy - r * 0.12, cx + r * 0.98, cy + r * 0.55, cx, cy + r);
    ctx.bezierCurveTo(cx - r * 0.98, cy + r * 0.55, cx - r * 0.95, cy - r * 0.12, cx, cy - r);
    ctx.closePath();
    ctx.fill();
  })(98, 104, 21);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#FFFFFF';
  setF(800, 40);
  ctx.fillText(t('app'), 160, 100);
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  setF(500, 20);
  ctx.fillText(t('tag'), 160, 134);

  /* request id chip */
  setF(700, 26);
  const idText = safe(req.id);
  const idW = ctx.measureText(idText).width;
  const chipW = idW + 56, chipH = 60, chipX = W - 60 - chipW, chipY = 74;
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  rr(ctx, chipX, chipY, chipW, chipH, 30);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.textBaseline = 'middle';
  ctx.fillText(idText, chipX + 28, chipY + chipH / 2 + 1);

  /* header title */
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#FFFFFF';
  setF(800, 52);
  ctx.fillText(t('request_profile'), 70, 240);

  /* urgency pill (right) */
  const urgLabel = t('urgency_' + (req.urgency || 'normal'));
  setF(700, 24);
  const uw = ctx.measureText(urgLabel).width;
  const pillW = uw + 52, pillH = 52, pillX = W - 70 - pillW, pillY = 202;
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  rr(ctx, pillX, pillY, pillW, pillH, 26);
  ctx.fill();
  ctx.fillStyle = '#A10F22';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(urgLabel, pillX + pillW / 2, pillY + pillH / 2 + 1);

  /* main card */
  ctx.save();
  ctx.shadowColor = 'rgba(15,23,42,0.14)';
  ctx.shadowBlur = 44;
  ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#FFFFFF';
  rr(ctx, 56, 262, W - 112, 952, 46);
  ctx.fill();
  ctx.restore();

  /* blood group badge */
  ctx.save();
  ctx.shadowColor = 'rgba(217,10,36,0.38)';
  ctx.shadowBlur = 34;
  ctx.shadowOffsetY = 12;
  const bgr = ctx.createLinearGradient(760, 296, 972, 508);
  bgr.addColorStop(0, '#F5162F');
  bgr.addColorStop(1, '#920B21');
  ctx.fillStyle = bgr;
  ctx.beginPath(); ctx.arc(866, 402, 104, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(866, 402, 96, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#FFFFFF';
  setF(800, 74);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(safe(req.bloodGroup), 866, 406);

  /* patient */
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#94A3B8';
  setF(700, 21);
  ctx.fillText(t('patient_name').toUpperCase(), 110, 342);

  ctx.fillStyle = '#0F172A';
  setF(800, 44);
  const nameLines = wrapLines(ctx, safe(req.patientName), 620).slice(0, 2);
  if (wrapLines(ctx, safe(req.patientName), 620).length > 2) {
    nameLines[1] = nameLines[1].replace(/.{0,3}$/, '…');
  }
  nameLines.forEach((l, i) => ctx.fillText(l, 110, 392 + i * 52));

  /* hospital */
  ctx.fillStyle = '#94A3B8';
  setF(700, 21);
  ctx.fillText(t('hospital_name').toUpperCase(), 110, 486);

  ctx.fillStyle = '#334155';
  setF(600, 30);
  const hospLines = wrapLines(ctx, safe(req.hospitalName), 620).slice(0, 2);
  hospLines.forEach((l, i) => ctx.fillText(l, 110, 526 + i * 38));

  /* divider */
  ctx.strokeStyle = '#F1F5F9';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(110, 606); ctx.lineTo(970, 606); ctx.stroke();

  /* three column strip */
  const cols = [
    { x: 110, label: t('bags'), value: `${N(safe(req.bags))} ${t('bag_unit')}` },
    { x: 428, label: t('required_date'), value: fmtDate(req.requiredDate, lang) },
    { x: 748, label: t('required_time'), value: fmtTime(req.requiredTime, lang) }
  ];
  cols.forEach((c) => {
    ctx.fillStyle = '#94A3B8';
    setF(700, 21);
    ctx.textAlign = 'left';
    ctx.fillText(c.label.toUpperCase(), c.x, 664);
    ctx.fillStyle = '#0F172A';
    setF(700, 30);
    ctx.fillText(c.value, c.x, 706);
  });

  ctx.strokeStyle = '#F1F5F9';
  ctx.beginPath(); ctx.moveTo(110, 750); ctx.lineTo(970, 750); ctx.stroke();

  /* location */
  ctx.fillStyle = '#94A3B8';
  setF(700, 21);
  ctx.fillText(t('location_details').toUpperCase(), 110, 802);

  const locParts = [req.division, req.district, req.upazila, req.area].filter(Boolean);
  const loc = locParts.length ? locParts.join(', ') : safe(req.detailedAddress);
  ctx.fillStyle = '#0F172A';
  setF(600, 29);
  const locLines = wrapLines(ctx, loc, 860).slice(0, 2);
  locLines.forEach((l, i) => ctx.fillText(l, 110, 844 + i * 38));

  /* contact */
  ctx.fillStyle = '#94A3B8';
  setF(700, 21);
  ctx.fillText(t('contact_details').toUpperCase(), 110, 942);

  const phoneText = N(safe(req.phone));
  ctx.fillStyle = '#0F172A';
  setF(800, 36);
  ctx.fillText(phoneText, 110, 988);
  const pw = ctx.measureText(phoneText).width;

  if (req.contactName) {
    ctx.fillStyle = '#64748B';
    setF(500, 24);
    ctx.fillText('•  ' + safe(req.contactName), 110 + pw + 16, 988);
  }

  /* bottom divider */
  ctx.strokeStyle = '#F1F5F9';
  ctx.beginPath(); ctx.moveTo(110, 1018); ctx.lineTo(970, 1018); ctx.stroke();

  /* QR code */
  let qrCanvas = null;
  try {
    qrCanvas = await makeQRCanvas(publicUrl('/request/' + req.id), 340);
  } catch (e) { /* QR is optional */ }

  const qx = 828, qy = 1040, qs = 160;
  ctx.fillStyle = '#FFFFFF';
  rr(ctx, qx - 10, qy - 10, qs + 20, qs + 20, 18);
  ctx.fill();
  ctx.strokeStyle = '#F1F5F9';
  ctx.lineWidth = 2;
  rr(ctx, qx - 10, qy - 10, qs + 20, qs + 20, 18);
  ctx.stroke();

  if (qrCanvas) {
    ctx.drawImage(qrCanvas, qx, qy, qs, qs);
  } else {
    ctx.fillStyle = '#F1F5F9';
    rr(ctx, qx, qy, qs, qs, 10);
    ctx.fill();
    ctx.fillStyle = '#94A3B8';
    setF(700, 22);
    ctx.textAlign = 'center';
    ctx.fillText('QR', qx + qs / 2, qy + qs / 2 + 8);
    ctx.textAlign = 'left';
  }

  /* brand block bottom-left */
  ctx.textAlign = 'left';
  ctx.fillStyle = '#D90A24';
  setF(800, 32);
  ctx.fillText(t('app'), 110, 1090);

  ctx.fillStyle = '#64748B';
  setF(500, 22);
  ctx.fillText(t('tag'), 110, 1126);

  ctx.fillStyle = '#94A3B8';
  setF(500, 20);
  ctx.fillText(t('scan_qr'), 110, 1160);

  /* footer */
  ctx.textAlign = 'center';
  ctx.fillStyle = '#94A3B8';
  setF(500, 21);
  ctx.fillText(t('generated_by'), W / 2, 1276);

  return cv;
}

/* ══════════════════════════════════════════════════════════════
   11. BLOOD REQUEST FORM
   ══════════════════════════════════════════════════════════════ */
const EMPTY_REQUEST = {
  patientName: '', patientAge: '', bloodGroup: '', bags: '1',
  hospitalName: '', hospitalAddress: '', requiredDate: '', requiredTime: '',
  urgency: 'normal', division: '', district: '', upazila: '', area: '',
  detailedAddress: '', contactName: '', phone: '', altPhone: '',
  whatsapp: '', notes: ''
};

function RequestFormPage({ lang, t, showToast }) {
  const [form, setForm] = useState(EMPTY_REQUEST);
  const [confirmed, setConfirmed] = useState(false);
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const topRef = useRef(null);

  const set = (k) => (e) => {
    const v = e && e.target ? e.target.value : e;
    setForm((f) => {
      const next = { ...f, [k]: v };
      if (k === 'division') { next.district = ''; }
      return next;
    });
    setErrors((er) => ({ ...er, [k]: null }));
  };

  const districts = useMemo(() => {
    const d = DIVISIONS.find((x) => x.en === form.division);
    return d ? d.districts : [];
  }, [form.division]);

  function validate() {
    const e = {};
    ['patientName', 'patientAge', 'bloodGroup', 'bags', 'hospitalName', 'hospitalAddress',
      'requiredDate', 'requiredTime', 'division', 'district', 'upazila', 'area',
      'detailedAddress', 'contactName', 'phone'].forEach((k) => {
        if (!String(form[k] || '').trim()) e[k] = t('err_required');
      });
    if (form.phone && !isValidPhone(form.phone)) e.phone = t('err_phone');
    if (form.altPhone && !isValidPhone(form.altPhone)) e.altPhone = t('err_phone');
    if (form.whatsapp && !isValidPhone(form.whatsapp)) e.whatsapp = t('err_phone');
    if (!confirmed) e.confirm = t('err_confirm');
    return e;
  }

  async function submit(ev) {
    ev.preventDefault();
    const e = validate();
    if (Object.keys(e).length) {
      setErrors(e);
      if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    setBusy(true);
    try {
      const id = await nextRequestId();
      const record = {
        ...form,
        patientAge: Number(form.patientAge) || form.patientAge,
        bags: Number(form.bags) || 1,
        id,
        fulfilled: false,
        createdAt: new Date().toISOString()
      };
      await putDoc('requests', id, record);
      showToast(t('msg_request_created'));
      navigate('/request/' + id);
    } catch (err) {
      console.error(err);
      showToast(t('err_generic'));
    }
    setBusy(false);
  }

  return (
    <div className="mx-auto max-w-3xl px-4 py-8" ref={topRef}>
      <button onClick={() => navigate('/')} className="mb-5 inline-flex items-center gap-1.5 text-[13px] font-bold text-slate-500 hover:text-brand-600">
        <Icon.arrowLeft width="15" height="15" /> {t('back')}
      </button>

      <div className="rounded-3xl bg-gradient-to-br from-brand-600 to-brand-900 p-6 text-white shadow-red">
        <span className="inline-flex items-center gap-2 rounded-full bg-white/15 px-3 py-1 text-[11px] font-bold">
          <Icon.drop width="12" height="12" /> {t('request_profile')}
        </span>
        <h1 className="mt-3 text-[24px] font-extrabold leading-tight sm:text-3xl">{t('rf_title')}</h1>
        <p className="mt-2 text-[13px] leading-relaxed text-white/80">{t('rf_sub')}</p>
      </div>

      <form onSubmit={submit} className="mt-5 space-y-4">
        {/* Patient */}
        <Card>
          <SectionTitle>{t('patient_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label={t('patient_name')} required error={errors.patientName}>
                <input className={inputCls} value={form.patientName} onChange={set('patientName')} placeholder="Md. Rahim Uddin" />
              </Field>
            </div>
            <Field label={t('patient_age')} required error={errors.patientAge}>
              <input type="number" min="0" max="120" className={inputCls} value={form.patientAge} onChange={set('patientAge')} placeholder="34" />
            </Field>
            <Field label={t('blood_group')} required error={errors.bloodGroup}>
              <select className={selectCls} style={selectStyle} value={form.bloodGroup} onChange={set('bloodGroup')}>
                <option value="">{t('any')}</option>
                {BLOOD_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
              </select>
            </Field>
            <Field label={t('bags')} required error={errors.bags}>
              <input type="number" min="1" max="50" className={inputCls} value={form.bags} onChange={set('bags')} />
            </Field>
            <Field label={t('urgency')} required error={errors.urgency}>
              <select className={selectCls} style={selectStyle} value={form.urgency} onChange={set('urgency')}>
                <option value="normal">{t('urgency_normal')}</option>
                <option value="urgent">{t('urgency_urgent')}</option>
                <option value="critical">{t('urgency_critical')}</option>
              </select>
            </Field>
          </div>
        </Card>

        {/* Hospital */}
        <Card>
          <SectionTitle>{t('hospital_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label={t('hospital_name')} required error={errors.hospitalName}>
                <input className={inputCls} value={form.hospitalName} onChange={set('hospitalName')} placeholder="Dhaka Medical College Hospital" />
              </Field>
            </div>
            <div className="sm:col-span-2">
              <Field label={t('hospital_address')} required error={errors.hospitalAddress}>
                <input className={inputCls} value={form.hospitalAddress} onChange={set('hospitalAddress')} placeholder="Bakshi Bazar, Dhaka 1000" />
              </Field>
            </div>
            <Field label={t('required_date')} required error={errors.requiredDate}>
              <input type="date" className={inputCls} value={form.requiredDate} onChange={set('requiredDate')} />
            </Field>
            <Field label={t('required_time')} required error={errors.requiredTime}>
              <input type="time" className={inputCls} value={form.requiredTime} onChange={set('requiredTime')} />
            </Field>
          </div>
        </Card>

        {/* Location */}
        <Card>
          <SectionTitle>{t('location_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <Field label={t('division')} required error={errors.division}>
              <select className={selectCls} style={selectStyle} value={form.division} onChange={set('division')}>
                <option value="">{t('select_division')}</option>
                {DIVISIONS.map((d) => <option key={d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}
              </select>
            </Field>
            <Field label={t('district')} required error={errors.district}>
              <select
                className={selectCls}
                style={selectStyle}
                value={form.district}
                onChange={set('district')}
                disabled={!form.division}
              >
                <option value="">{t('select_district')}</option>
                {districts.map((d) => <option key={d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}
              </select>
            </Field>
            <Field label={t('upazila')} required error={errors.upazila}>
              <input className={inputCls} value={form.upazila} onChange={set('upazila')} placeholder={t('upazila_ph')} />
            </Field>
            <Field label={t('area')} required error={errors.area}>
              <input className={inputCls} value={form.area} onChange={set('area')} placeholder={t('area_ph')} />
            </Field>
            <div className="sm:col-span-2">
              <Field label={t('detailed_address')} required error={errors.detailedAddress}>
                <input className={inputCls} value={form.detailedAddress} onChange={set('detailedAddress')} placeholder="Ward 12, Road 5, House 22" />
              </Field>
            </div>
          </div>
        </Card>

        {/* Contact */}
        <Card>
          <SectionTitle>{t('contact_details')}</SectionTitle>
          <div className="grid gap-3.5 sm:grid-cols-2">
            <div className="sm:col-span-2">
              <Field label={t('contact_person')} required error={errors.contactName}>
                <input className={inputCls} value={form.contactName} onChange={set('contactName')} placeholder="Karim Ahmed" />
              </Field>
            </div>
            <Field label={t('phone')} required error={errors.phone}>
              <input type="tel" className={inputCls} value={form.phone} onChange={set('phone')} placeholder="01XXXXXXXXX" />
            </Field>
            <Field label={t('alt_phone')} error={errors.altPhone} hint={t('optional')}>
              <input type="tel" className={inputCls} value={form.altPhone} onChange={set('altPhone')} placeholder="01XXXXXXXXX" />
            </Field>
            <div className="sm:col-span-2">
              <Field label={t('whatsapp')} error={errors.whatsapp} hint={t('optional')}>
                <input type="tel" className={inputCls} value={form.whatsapp} onChange={set('whatsapp')} placeholder="01XXXXXXXXX" />
              </Field>
            </div>
            <div className="sm:col-span-2">
              <Field label={t('notes')} hint={t('optional')}>
                <textarea rows="3" className={inputCls} value={form.notes} onChange={set('notes')} placeholder={t('notes_ph')} />
              </Field>
            </div>
          </div>
        </Card>

        {/* Confirm */}
        <ConfirmCheck checked={confirmed} onChange={(v) => { setConfirmed(v); setErrors((e) => ({ ...e, confirm: null })); }} t={t} error={errors.confirm} />

        <button
          type="submit"
          disabled={!confirmed || busy}
          className="flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-500 to-brand-700 px-6 py-4 text-[15px] font-extrabold text-white shadow-red transition enabled:hover:brightness-105 enabled:active:scale-[.99] disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none"
        >
          {busy ? <><Spinner /> {t('submitting')}</> : <><Icon.drop width="18" height="18" /> {t('submit_request')}</>}
        </button>
        <p className="pb-4 text-center text-[11.5px] text-slate-400">{t('no_account')}</p>
      </form>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   13. SHARE BAR
   ══════════════════════════════════════════════════════════════ */
function ShareBar({ url, message, t, onDownload, busy }) {
  const [copied, setCopied] = useState(false);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2200);
  };

  const wa = `https://wa.me/?text=${encodeURIComponent(message + '\n' + url)}`;
  const fb = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;

  const native = async () => {
    if (navigator.share) {
      try { await navigator.share({ title: t('app'), text: message, url }); } catch (e) {}
    } else {
      copy();
    }
  };

  const btn = 'flex flex-col items-center justify-center gap-1.5 rounded-2xl border px-2 py-3 text-[11px] font-bold transition active:scale-[.97]';

  return (
    <div>
      <h3 className="mb-3 text-[13px] font-extrabold text-slate-700">{t('share_this')}</h3>
      <div className="grid grid-cols-4 gap-2">
        <a href={wa} target="_blank" rel="noopener noreferrer" className={`${btn} border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100`}>
          <Icon.whatsapp width="19" height="19" /> {t('chat_whatsapp')}
        </a>
        <a href={fb} target="_blank" rel="noopener noreferrer" className={`${btn} border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100`}>
          <Icon.facebook width="19" height="19" /> Facebook
        </a>
        <button onClick={copy} className={`${btn} ${copied ? 'border-brand-300 bg-brand-100 text-brand-800' : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'}`}>
          {copied ? <Icon.check width="19" height="19" /> : <Icon.copy width="19" height="19" />}
          {copied ? t('copied') : t('copy_link')}
        </button>
        <button onClick={native} className={`${btn} border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100`}>
          <Icon.share width="19" height="19" /> {t('native_share')}
        </button>
      </div>

      {onDownload && (
        <button
          onClick={onDownload}
          disabled={busy}
          className="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-brand-500 to-brand-700 px-6 py-4 text-[14.5px] font-extrabold text-white shadow-red transition enabled:hover:brightness-105 enabled:active:scale-[.99] disabled:opacity-50"
        >
          {busy ? <><Spinner /> {t('generating')}</> : <><Icon.download width="18" height="18" /> {t('download_card')}</>}
        </button>
      )}

      <div className="mt-3 rounded-xl border border-slate-100 bg-slate-50 px-3 py-2.5">
        <div className="text-[10.5px] font-bold uppercase tracking-wide text-slate-400">{t('public_link')}</div>
        <div className="mt-0.5 truncate text-[12px] font-semibold text-slate-600">{url}</div>
      </div>
    </div>
  );
}

  useEffect(() => {

      setReq(d);
      setLoading(false);
    });
    return () => { alive = false; };
  }, [id]);

  const url = publicUrl('/request/' + id);

  useEffect(() => {
    if (!qrRef.current || !req) return;
    qrRef.current.innerHTML = '';

function DonorSearchPage({ lang, t }) {
  const [f, setF] = useState({ bloodGroup: '', division: '', district: '', upazila: '', availability: '' });
  const [list, setList] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => { fetchAll('donors').then((d) => { setList(d); setLoaded(true); }); }, []);

  const districts = useMemo(() => {
    const d = DIVISIONS.find((x) => x.en === f.division);
    return d ? d.districts : [];
  }, [f.division]);

  const set = (k) => (e) => {
    const v = e.target.value;
    setF((prev) => {
      const next = { ...prev, [k]: v };
      if (k === 'division') next.district = '';
      return next;
    });
  };

  const results = useMemo(() => {
    return list.filter((d) => {
      if (f.bloodGroup && d.bloodGroup !== f.bloodGroup) return false;
      if (f.division && d.division !== f.division) return false;
      if (f.district && d.district !== f.district) return false;
      if (f.upazila && !String(d.upazila || '').toLowerCase().includes(f.upazila.toLowerCase())) return false;
      if (f.availability && d.availability !== f.availability) return false;
      return true;
    });
  }, [list, f]);

  const reset = () => setF({ bloodGroup: '', division: '', district: '', upazila: '', availability: '' });

  return (
    <div className="mx-auto max-w-5xl px-4 py-6">
      <FilterShell title={t('ds_title')} sub={t('ds_sub')}>
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-5">
          <select className={filterSelect} value={f.bloodGroup} onChange={set('bloodGroup')}>
            <option value="">{t('blood_group')}: {t('any')}</option>
            {BLOOD_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
          <select className={filterSelect} value={f.division} onChange={set('division')}>
            <option value="">{t('division')}: {t('any')}</option>
            {DIVISIONS.map((d) => <option key={d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}
          </select>
          <select className={filterSelect} value={f.district} onChange={set('district')} disabled={!f.division}>
            <option value="">{t('district')}: {t('any')}</option>
            {districts.map((d) => <option key={d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}
          </select>
          <input className={filterSelect + ' placeholder-white/60'} value={f.upazila} onChange={set('upazila')} placeholder={t('upazila')} />
          <select className={filterSelect} value={f.availability} onChange={set('availability')}>
            <option value="">{t('filter_availability')}: {t('any')}</option>
            <option value="available">{t('available')}</option>
            <option value="unavailable">{t('unavailable')}</option>
          </select>
        </div>
        <button onClick={reset} className="mt-2.5 rounded-lg border border-white/25 bg-white/10 px-3 py-1.5 text-[11.5px] font-bold text-white/90 hover:bg-white/20">
          {t('reset')}
        </button>
      </FilterShell>

      <div className="mt-4 flex items-center justify-between">
        <p className="text-[12.5px] font-semibold text-slate-500">
          {loaded ? `${num(results.length, lang)} ${t('found')}` : t('loading')}
        </p>
      </div>

      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        {!loaded ? (
          <Card className="sm:col-span-2"><div className="py-6 text-center text-[13px] text-slate-400">{t('loading')}</div></Card>
        ) : results.length === 0 ? (
          <Card className="sm:col-span-2"><div className="py-8 text-center text-[13px] text-slate-400">{t('no_donors')}</div></Card>
        ) : (
          results.map((d) => <DonorListCard key={d.id} donor={d} lang={lang} t={t} />)
        )}
      </div>
    </div>
  );
}

function RequestSearchPage({ lang, t }) {
  const [f, setF] = useState({ bloodGroup: '', district: '', upazila: '', urgency: '', status: '' });
  const [list, setList] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => { fetchAll('requests').then((d) => { setList(d); setLoaded(true); }); }, []);

  const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));

  const results = useMemo(() => {
    return list.filter((r) => {
      if (f.bloodGroup && r.bloodGroup !== f.bloodGroup) return false;
      if (f.district && r.district !== f.district) return false;
      if (f.upazila && !String(r.upazila || '').toLowerCase().includes(f.upazila.toLowerCase())) return false;
      if (f.urgency && r.urgency !== f.urgency) return false;
      if (f.status && reqStatus(r) !== f.status) return false;
      return true;
    });
  }, [list, f]);

  const allDistricts = useMemo(() => DIVISIONS.flatMap((d) => d.districts.map((x) => ({ ...x, div: d.en }))), []);
  const reset = () => setF({ bloodGroup: '', district: '', upazila: '', urgency: '', status: '' });

  return (
    <div className="mx-auto max-w-5xl px-4 py-6">
      <FilterShell title={t('rs_title')} sub={t('rs_sub')}>
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-5">
          <select className={filterSelect} value={f.bloodGroup} onChange={set('bloodGroup')}>
            <option value="">{t('blood_group')}: {t('any')}</option>
            {BLOOD_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
          <select className={filterSelect} value={f.district} onChange={set('district')}>
            <option value="">{t('district')}: {t('any')}</option>
            {allDistricts.map((d) => <option key={d.div + d.en} value={d.en}>{lang === 'bn' ? d.bn : d.en}</option>)}
          </select>
          <input className={filterSelect + ' placeholder-white/60'} value={f.upazila} onChange={set('upazila')} placeholder={t('upazila')} />
          <select className={filterSelect} value={f.urgency} onChange={set('urgency')}>
            <option value="">{t('urgency')}: {t('any')}</option>
            <option value="normal">{t('urgency_normal')}</option>
            <option value="urgent">{t('urgency_urgent')}</option>
            <option value="critical">{t('urgency_critical')}</option>
          </select>
          <select className={filterSelect} value={f.status} onChange={set('status')}>
            <option value="">{t('status')}: {t('any')}</option>
            <option value="active">{t('status_active')}</option>
            <option value="fulfilled">{t('status_fulfilled')}</option>
            <option value="expired">{t('status_expired')}</option>
          </select>
        </div>
        <button onClick={reset} className="mt-2.5 rounded-lg border border-white/25 bg-white/10 px-3 py-1.5 text-[11.5px] font-bold text-white/90 hover:bg-white/20">
          {t('reset')}
        </button>
      </FilterShell>

      <div className="mt-4 flex items-center justify-between">
        <p className="text-[12.5px] font-semibold text-slate-500">
          {loaded ? `${num(results.length, lang)} ${t('found')}` : t('loading')}
        </p>
        <button onClick={() => navigate('/request-blood')} className="inline-flex items-center gap-1 rounded-lg bg-brand-50 px-3 py-1.5 text-[11.5px] font-bold text-brand-700">
          <Icon.plus width="13" height="13" /> {t('nav_request')}
        </button>
      </div>

      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        {!loaded ? (
          <Card className="sm:col-span-2"><div className="py-6 text-center text-[13px] text-slate-400">{t('loading')}</div></Card>
        ) : results.length === 0 ? (
          <Card className="sm:col-span-2"><div className="py-8 text-center text-[13px] text-slate-400">{t('no_requests')}</div></Card>
        ) : (
          results.map((r) => <RequestListCard key={r.id} req={r} lang={lang} t={t} />)
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   17. APP ROOT
   ══════════════════════════════════════════════════════════════ */
function App() {
  const [lang, setLangState] = useState(() => localStorage.getItem('bc_lang') || 'en');
  const [path, setPath] = useState(getPath());
  const [toast, setToast] = useState('');

  const t = useCallback((key) => (T[lang] && T[lang][key] !== undefined ? T[lang][key] : key), [lang]);

  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem('bc_lang', l); } catch (e) {}
  };

  useEffect(() => {
    document.documentElement.lang = lang;
    document.title = T[lang].app + ' — ' + T[lang].tag;
  }, [lang]);

  useEffect(() => {
    const onPop = () => setPath(getPath());
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2600);
  };

  const segments = path.split('/').filter(Boolean);
  let page;
  if (segments.length === 0) page = { name: 'home' };
  else if (segments[0] === 'request-blood') page = { name: 'requestForm' };
  else if (segments[0] === 'register-donor') page = { name: 'donorForm' };
  else if (segments[0] === 'donors') page = { name: 'donorSearch' };
  else if (segments[0] === 'requests') page = { name: 'requestSearch' };
  else if (segments[0] === 'request' && segments[1]) page = { name: 'requestProfile', id: segments[1] };
  else if (segments[0] === 'donor' && segments[1]) page = { name: 'donorProfile', id: segments[1] };
  else page = { name: 'home' };

  let content;
  switch (page.name) {
    case 'requestForm': content = <RequestFormPage lang={lang} t={t} showToast={showToast} />; break;
    case 'donorForm': content = <DonorFormPage lang={lang} t={t} showToast={showToast} />; break;
    case 'donorSearch': content = <DonorSearchPage lang={lang} t={t} />; break;
    case 'requestSearch': content = <RequestSearchPage lang={lang} t={t} />; break;
    case 'requestProfile': content = <RequestProfilePage id={page.id} lang={lang} t={t} showToast={showToast} />; break;
    case 'donorProfile': content = <DonorProfilePage id={page.id} lang={lang} t={t} />; break;
    default: content = <HomePage lang={lang} t={t} />;
  }

  return (
    <div className="min-h-screen bg-slate-50/60">
      <Header lang={lang} setLang={setLang} t={t} />
      <main key={path + lang}>{content}</main>
      <Footer t={t} />
      <Toast message={toast} />
      {/* Mobile sticky quick action */}
      <div className="pointer-events-none fixed inset-x-0 bottom-0 z-30 flex justify-center pb-4 md:hidden">
        <button
          onClick={() => navigate('/request-blood')}
          className="pointer-events-auto inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-brand-500 to-brand-700 px-5 py-3.5 text-[13px] font-extrabold text-white shadow-red active:scale-95"
        >
          <Icon.drop width="16" height="16" /> {t('nav_request')}
        </button>
      </div>
      <div className="h-16 md:hidden" />
    </div>
  );
}

const rootEl = document.getElementById('root');
rootEl.innerHTML = '';
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
